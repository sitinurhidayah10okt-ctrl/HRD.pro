<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem HRD & Absensi Karyawan Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Rendered via JavaScript -->
    </div>

    <script>
        // Data & State Management
        let state = {
            currentLang: 'ms', // 'ms' or 'en'
            currentUser: { id: 'EMP001', name: 'Siti Nurhidayah', role: 'HR Manager', email: 'siti.nurhidayah@company.com', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150' },
            currentView: 'dashboard',
            selectedMonth: '2026-11',
            selectedDate: '2026-11-10',
            editingAttendanceId: null,
            employees: [
                { id: 'EMP001', name: 'Siti Nurhidayah', role: 'HR Manager', department: 'Human Resources', salary: 6500, avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150' },
                { id: 'EMP002', name: 'Ahmad bin Zulkifli', role: 'Administrative Executive', department: 'Administration', salary: 4500, avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150' },
                { id: 'EMP003', name: 'Nurul Huda', role: 'Finance Officer', department: 'Finance', salary: 5200, avatar: 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150' }
            ],
            attendance: [
                { id: 'ATT1', empId: 'EMP001', date: '2026-11-10', clockIn: '08:00', clockOut: '17:00', status: 'Present', ot: 0, notes: 'Normal working hours' },
                { id: 'ATT2', empId: 'EMP002', date: '2026-11-10', clockIn: '08:45', clockOut: '17:15', status: 'Late', ot: 0.25, notes: 'Traffic jam' },
                { id: 'ATT3', empId: 'EMP003', date: '2026-11-10', clockIn: '--:--', clockOut: '--:--', status: 'On Leave', ot: 0, notes: 'Annual Leave' }
            ],
            leaves: [
                { id: 'LV1', empId: 'EMP002', type: 'Annual Leave', startDate: '2026-11-15', endDate: '2026-11-16', reason: 'Family event', status: 'Pending' },
                { id: 'LV2', empId: 'EMP003', type: 'Medical Leave', startDate: '2026-11-10', endDate: '2026-11-10', reason: 'Fever / Clinic', status: 'Approved' }
            ]
        };

        const translations = {
            ms: {
                brand: 'Sistem HRD Enterprise',
                dashboard: 'Utama (Dashboard)',
                attendance: 'Kehadiran & Absensi',
                leaves: 'Pengurusan Cuti',
                payroll: 'Penggajian (Payroll)',
                employees: 'Data Karyawan',
                logout: 'Log Keluar',
                login: 'Log Masuk',
                welcome: 'Selamat Datang',
                totalStaff: 'Jumlah Karyawan',
                presentToday: 'Hadir Hari Ini',
                pendingLeave: 'Permohonan Cuti',
                monthlyPayroll: 'Anggaran Gaji Bulan Ini',
                attendanceLog: 'Log Kehadiran Harian',
                edit: 'Sunting',
                save: 'Simpan',
                cancel: 'Batal',
                payslip: 'Slip Gaji',
                status: 'Status',
                actions: 'Tindakan'
            },
            en: {
                brand: 'Enterprise HR System',
                dashboard: 'Dashboard',
                attendance: 'Attendance',
                leaves: 'Leave Management',
                payroll: 'Payroll & Salary',
                employees: 'Employee Directory',
                logout: 'Log Out',
                login: 'Log In',
                welcome: 'Welcome',
                totalStaff: 'Total Employees',
                presentToday: 'Present Today',
                pendingLeave: 'Pending Leaves',
                monthlyPayroll: 'Estimated Monthly Payroll',
                attendanceLog: 'Daily Attendance Log',
                edit: 'Edit',
                save: 'Save',
                cancel: 'Cancel',
                payslip: 'Payslip',
                status: 'Status',
                actions: 'Actions'
            }
        };

        function t(key) {
            return translations[state.currentLang][key] || key;
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <header class="bg-indigo-900 text-white shadow-md flex justify-between items-center px-6 py-4">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="briefcase" class="w-8 h-8 text-indigo-400"></i>
                        <span class="text-xl font-bold">${t('brand')}</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button onclick="toggleLang()" class="bg-indigo-800 px-3 py-1.5 rounded text-sm font-medium hover:bg-indigo-700">
                            ${state.currentLang === 'ms' ? '🇺🇸 EN' : '🇲🇾 MS'}
                        </button>
                        <div class="flex items-center space-x-2 border-l pl-4 border-indigo-700">
                            <img src="${state.currentUser.avatar}" class="w-9 h-9 rounded-full object-cover border border-indigo-400">
                            <div class="text-left text-xs">
                                <p class="font-semibold">${state.currentUser.name}</p>
                                <p class="text-indigo-300">${state.currentUser.role}</p>
                            </div>
                        </div>
                    </div>
                </header>

                <div class="flex flex-1">
                    <!-- Sidebar -->
                    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col p-4 space-y-2">
                        <a href="#" onclick="switchView('dashboard')" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg ${state.currentView === 'dashboard' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800'}">
                            <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>${t('dashboard')}</span>
                        </a>
                        <a href="#" onclick="switchView('attendance')" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg ${state.currentView === 'attendance' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800'}">
                            <i data-lucide="calendar-check" class="w-5 h-5"></i><span>${t('attendance')}</span>
                        </a>
                        <a href="#" onclick="switchView('leaves')" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg ${state.currentView === 'leaves' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800'}">
                            <i data-lucide="calendar-days" class="w-5 h-5"></i><span>${t('leaves')}</span>
                        </a>
                        <a href="#" onclick="switchView('payroll')" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg ${state.currentView === 'payroll' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800'}">
                            <i data-lucide="wallet" class="w-5 h-5"></i><span>${t('payroll')}</span>
                        </a>
                        <a href="#" onclick="switchView('employees')" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg ${state.currentView === 'employees' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800'}">
                            <i data-lucide="users" class="w-5 h-5"></i><span>${t('employees')}</span>
                        </a>
                    </aside>

                    <!-- Main Content -->
                    <main class="flex-1 p-8 overflow-y-auto">
                        ${renderViewContent()}
                    </main>
                </div>
            `;
            lucide.createIcons();
        }

        function renderViewContent() {
            if (state.currentView === 'dashboard') {
                return `
                    <h1 class="text-2xl font-bold mb-6">${t('welcome')}, ${state.currentUser.name}!</h1>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <p class="text-sm text-slate-500">${t('totalStaff')}</p>
                            <h3 class="text-3xl font-bold mt-2">${state.employees.length}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <p class="text-sm text-slate-500">${t('presentToday')}</p>
                            <h3 class="text-3xl font-bold mt-2 text-emerald-600">2 / 3</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <p class="text-sm text-slate-500">${t('pendingLeave')}</p>
                            <h3 class="text-3xl font-bold mt-2 text-amber-600">1</h3>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <p class="text-sm text-slate-500">${t('monthlyPayroll')}</p>
                            <h3 class="text-3xl font-bold mt-2 text-indigo-600">RM 16,200</h3>
                        </div>
                    </div>
                `;
            } else if (state.currentView === 'attendance') {
                return `
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-2xl font-bold">${t('attendanceLog')}</h1>
                        <div class="flex space-x-3">
                            <input type="date" value="${state.selectedDate}" onchange="updateDate(this.value)" class="border rounded-lg px-3 py-2 text-sm bg-white">
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-100 border-b text-slate-600 text-sm font-semibold">
                                    <th class="p-4">Karyawan / Employee</th>
                                    <th class="p-4">Date</th>
                                    <th class="p-4">Clock In</th>
                                    <th class="p-4">Clock Out</th>
                                    <th class="p-4">${t('status')}</th>
                                    <th class="p-4 text-right">${t('actions')}</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${state.attendance.map(att => {
                                    const emp = state.employees.find(e => e.id === att.empId);
                                    const isEditing = state.editingAttendanceId === att.id;
                                    return `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-4 flex items-center space-x-3">
                                                <img src="${emp?.avatar}" class="w-8 h-8 rounded-full object-cover">
                                                <span class="font-medium">${emp?.name}</span>
                                            </td>
                                            <td class="p-4 text-slate-600">${att.date}</td>
                                            <td class="p-4">${isEditing ? `<input type="time" id="edit-in-${att.id}" value="${att.clockIn}" class="border rounded px-2 py-1 text-xs">` : att.clockIn}</td>
                                            <td class="p-4">${isEditing ? `<input type="time" id="edit-out-${att.id}" value="${att.clockOut}" class="border rounded px-2 py-1 text-xs">` : att.clockOut}</td>
                                            <td class="p-4">
                                                ${isEditing ? `
                                                    <select id="edit-status-${att.id}" class="border rounded px-2 py-1 text-xs">
                                                        <option value="Present" ${att.status==='Present'?'selected':''}>Present</option>
                                                        <option value="Late" ${att.status==='Late'?'selected':''}>Late</option>
                                                        <option value="On Leave" ${att.status==='On Leave'?'selected':''}>On Leave</option>
                                                        <option value="Absent" ${att.status==='Absent'?'selected':''}>Absent</option>
                                                    </select>
                                                ` : `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${att.status==='Present'?'bg-emerald-100 text-emerald-700':att.status==='Late'?'bg-amber-100 text-amber-700':'bg-rose-100 text-rose-700'}">${att.status}</span>`}
                                            </td>
                                            <td class="p-4 text-right">
                                                ${isEditing ? `
                                                    <button onclick="saveAttendance('${att.id}')" class="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-medium">${t('save')}</button>
                                                    <button onclick="cancelEdit()" class="bg-slate-200 text-slate-700 px-3 py-1 rounded text-xs font-medium ml-1">${t('cancel')}</button>
                                                ` : `
                                                    <button onclick="startEdit('${att.id}')" class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded text-xs font-medium hover:bg-indigo-100">${t('edit')}</button>
                                                `}
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (state.currentView === 'payroll') {
                return `
                    <h1 class="text-2xl font-bold mb-6">Payroll & Statutori (EPF, SOCSO, EIS)</h1>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-100 border-b text-slate-600 text-sm font-semibold">
                                    <th class="p-4">Employee</th>
                                    <th class="p-4">Basic Salary</th>
                                    <th class="p-4">EPF (11%)</th>
                                    <th class="p-4">SOCSO</th>
                                    <th class="p-4">EIS</th>
                                    <th class="p-4">Net Salary</th>
                                    <th class="p-4 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${state.employees.map(emp => {
                                    const epf = emp.salary * 0.11;
                                    const socso = 19.75; // statutory bracket estimate
                                    const eis = 7.90;
                                    const net = emp.salary - epf - socso - eis;
                                    return `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-4 font-medium">${emp.name}</td>
                                            <td class="p-4">RM ${emp.salary.toLocaleString()}</td>
                                            <td class="p-4 text-rose-600">- RM ${epf.toFixed(2)}</td>
                                            <td class="p-4 text-rose-600">- RM ${socso.toFixed(2)}</td>
                                            <td class="p-4 text-rose-600">- RM ${eis.toFixed(2)}</td>
                                            <td class="p-4 font-bold text-emerald-600">RM ${net.toFixed(2)}</td>
                                            <td class="p-4 text-right">
                                                <button onclick="alert('Payslip generated for ${emp.name}')" class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded text-xs font-medium hover:bg-indigo-100">${t('payslip')}</button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                return `<h1 class="text-2xl font-bold mb-6">Modul ${state.currentView}</h1><p class="text-slate-500">Modul aktif dan siap digunakan.</p>`;
            }
        }

        function switchView(view) {
            state.currentView = view;
            render();
        }

        function toggleLang() {
            state.currentLang = state.currentLang === 'ms' ? 'en' : 'ms';
            render();
        }

        function updateDate(val) {
            state.selectedDate = val;
            render();
        }

        function startEdit(id) {
            state.editingAttendanceId = id;
            render();
        }

        function cancelEdit() {
            state.editingAttendanceId = null;
            render();
        }

        function saveAttendance(id) {
            const inVal = document.getElementById(`edit-in-${id}`).value;
            const outVal = document.getElementById(`edit-out-${id}`).value;
            const statusVal = document.getElementById(`edit-status-${id}`).value;

            const att = state.attendance.find(a => a.id === id);
            if (att) {
                att.clockIn = inVal;
                att.clockOut = outVal;
                att.status = statusVal;
            }
            state.editingAttendanceId = null;
            render();
        }

        // Initial Render
        render();
    </script>
</body>
</html>
